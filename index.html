<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WWE Universe Ranking Manager 2.0</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>WWE Universe Ranking Manager 2.0</h1>
    <p>Gestión local de rankings, campeones, combates y carteleras</p>
  </header>

  <nav id="tabs"></nav>

  <main>
    <section id="tab-estado" class="tab-panel"></section>
    <section id="tab-gestion" class="tab-panel"></section>
    <section id="tab-rankings" class="tab-panel"></section>
    <section id="tab-combate" class="tab-panel"></section>
    <section id="tab-carteleras" class="tab-panel"></section>
    <section id="tab-listado" class="tab-panel"></section>
    <section id="tab-historial" class="tab-panel"></section>
  </main>

  <template id="base-card-template">
    <article class="card">
      <h3></h3>
      <div class="card-body"></div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
